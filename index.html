<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kavza Store</title>
<meta name="theme-color" content="#030504">
<link rel="icon" id="favicon">
<style>
  :root{
    --bg:#030504; --green:#02B362; --mint:#13E8A8;
    --teal:#1FD599; --yellow:#FFD84D; --dim:#5c7a6f;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--bg); color:#fff;
    font-family:"Segoe UI",system-ui,sans-serif;
    display:flex; justify-content:center; align-items:flex-start;
    padding:24px 16px; min-height:100dvh;
  }

  .app{width:100%; max-width:400px; display:flex; flex-direction:column; margin:auto 0; min-height:min(560px, calc(100dvh - 48px)); position:relative; z-index:1}

  /* ---------- LAYAR ---------- */
  .screen{
    display:none; flex-direction:column; align-items:center;
    flex:1; animation:fadeIn .45s ease both;
  }
  .screen.active{display:flex}
  @keyframes fadeIn{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}

  /* area list yang bisa di-scroll */
  .scrollarea{width:100%; overflow-y:auto; scrollbar-width:thin; scrollbar-color:rgba(19,232,168,.35) transparent}
  .scrollarea::-webkit-scrollbar{width:4px}
  .scrollarea::-webkit-scrollbar-thumb{background:rgba(19,232,168,.35); border-radius:99px}

  /* tap feedback */
  .tap{cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent}
  .tap:active{opacity:.75}

  /* tombol CTA pesan */
  .cta{
    width:100%; margin-top:14px; border:none; border-radius:12px;
    background:var(--green); color:#030504; cursor:pointer;
    font-family:inherit; font-weight:800; font-size:.95rem; letter-spacing:.5px;
    padding:15px 18px; transition:background .2s, transform .15s;
  }
  .cta:hover{background:var(--mint); transform:translateY(-1px)}
  .cta:active{transform:none}
  .cta small{display:block; font-weight:500; font-size:.7rem; opacity:.75; margin-top:2px}

  /* toast */
  #toast{
    position:fixed; left:50%; bottom:26px; transform:translate(-50%, 20px);
    background:#0f1a14; color:var(--mint); border:1px solid rgba(19,232,168,.5);
    padding:10px 20px; border-radius:999px; font-size:.82rem;
    opacity:0; pointer-events:none; transition:.3s; z-index:99;
  }
  #toast.show{opacity:1; transform:translate(-50%, 0)}

  /* ---------- INTRO ---------- */
  #intro{justify-content:center; gap:26px; text-align:center}
  .logo-wrap{width:min(240px,58vw); height:min(240px,58vw); position:relative}
  .logo-wrap::before{
    content:""; position:absolute; inset:-16px; border-radius:50%;
    border:1px solid rgba(19,232,168,.35);
    border-top-color:var(--mint);
    animation:spin 1.1s linear infinite;
  }
  .logo-wrap img{width:100%; height:100%; object-fit:contain; border-radius:50%}
  @keyframes spin{to{transform:rotate(360deg)}}

  .intro-line{overflow:hidden}
  .intro-line span{
    display:block;
    animation:riseUp .6s cubic-bezier(.2,.9,.3,1) both;
  }
  @keyframes riseUp{from{transform:translateY(105%)} to{transform:none}}
  .intro-sub{color:var(--teal); font-size:.9rem; letter-spacing:.5px}

  .bar{width:180px; height:2px; background:rgba(255,255,255,.08); overflow:hidden}
  .bar i{display:block; height:100%; width:0; background:var(--mint); animation:load 2.2s ease forwards}
  @keyframes load{to{width:100%}}

  /* ---------- MENU ---------- */
  #menu{justify-content:center; gap:16px; text-align:center}
  #menu .ava{
    width:104px; height:104px; border-radius:50%; overflow:hidden;
    border:1px solid rgba(19,232,168,.45); padding:9px;
  }
  #menu .ava img{width:100%; height:100%; object-fit:contain}
  #menu .tag{color:var(--dim); font-size:.76rem; margin-top:-8px}

  .flat-list{width:100%; display:flex; flex-direction:column; gap:8px}
  .btn{
    position:relative; width:100%;
    display:flex; align-items:center; gap:14px;
    background:#0a110d; color:#fff; cursor:pointer; text-align:left;
    border:none; border-radius:12px; overflow:hidden;
    padding:16px 18px; font-size:.95rem; font-weight:600; letter-spacing:.3px;
    transition:background .2s, transform .15s;
    font-family:inherit;
  }
  .btn::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:3px;
    background:rgba(19,232,168,.35); transition:background .2s;
  }
  .btn:hover{background:#0f1a14; transform:translateY(-1px)}
  .btn:hover::before{background:var(--mint)}
  .btn:active{transform:none}

  .btn .ico{
    width:46px; height:46px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background:rgba(19,232,168,.08); border-radius:11px;
    color:var(--mint); font-size:1rem; font-weight:800;
    transition:background .2s, color .2s;
  }
  .btn:hover .ico{background:var(--mint); color:#030504}
  .btn .txt{flex:1; line-height:1.25}
  .btn .txt small{display:block; color:var(--dim); font-size:.74rem; font-weight:400; margin-top:2px}
  .btn .arr{color:var(--dim); font-size:1.05rem; transition:color .2s, transform .2s}
  .btn:hover .arr{color:var(--mint); transform:translateX(3px)}

  .btn.ig .ico{background:rgba(255,216,77,.08); color:var(--yellow)}
  .btn.ig:hover .ico{background:var(--yellow); color:#030504}
  .btn.ig::before{background:rgba(255,216,77,.3)}
  .btn.ig:hover::before{background:var(--yellow)}
  .btn .ico svg{width:20px; height:20px; display:block}

  /* ---------- IKON SOSMED BULAT ---------- */
  .social-row{display:flex; gap:14px; justify-content:center; width:100%}
  .social-round{
    position:relative; width:48px; height:48px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:#0a110d; color:#8fb9a8; text-decoration:none;
    transition:background .22s, color .22s, transform .22s;
    -webkit-tap-highlight-color:transparent;
  }
  .social-round svg{width:22px; height:22px; display:block; position:relative; z-index:1; transition:transform .25s}

  /* cincin cahaya yang memancar keluar */
  .social-round::before{
    content:""; position:absolute; inset:-3px; border-radius:50%;
    border:1.5px solid currentColor; opacity:0; transform:scale(.85);
    transition:opacity .2s;
  }
  /* kilau berputar di tepi */
  .social-round::after{
    content:""; position:absolute; inset:-3px; border-radius:50%;
    background:conic-gradient(from 0deg, transparent 0 55%, currentColor 72%, transparent 88% 100%);
    -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 1px));
    mask:radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 1px));
    opacity:0; transition:opacity .2s;
  }

  .social-round:hover{color:#030504; transform:translateY(-3px) scale(1.06)}
  .social-round:hover svg{animation:iconPop .5s cubic-bezier(.2,1.6,.4,1)}
  .social-round:hover::before{opacity:1; animation:ringPulse 1.3s ease-out infinite}
  .social-round:hover::after{opacity:1; animation:spinRing 1.8s linear infinite}

  .social-round.ig:hover{background:var(--yellow); color:#030504; box-shadow:0 0 22px rgba(255,216,77,.55)}
  .social-round.dc:hover{background:var(--mint); color:#030504; box-shadow:0 0 22px rgba(19,232,168,.6)}
  .social-round:active{transform:scale(.96)}

  /* ---------- CARD HITUNG ROBUX ---------- */
  .calc-card{
    width:100%; background:#0a110d; border-radius:12px; padding:14px;
    display:flex; flex-direction:column; gap:10px;
  }
  .calc-top{display:flex; justify-content:space-between; align-items:baseline}
  .calc-top span{font-size:.66rem; letter-spacing:2px; color:var(--dim); text-transform:uppercase}
  .calc-top b{font-size:.66rem; color:var(--teal); font-weight:600; letter-spacing:.5px}
  .calc-field{position:relative}
  .calc-field input{
    width:100%; background:#050b08; color:#fff; font-family:inherit;
    border:1px solid rgba(255,255,255,.12); border-radius:9px;
    padding:11px 44px 11px 13px; font-size:.95rem; outline:none;
    transition:border-color .2s;
  }
  .calc-field input:focus{border-color:var(--mint)}
  .calc-field input::-webkit-outer-spin-button,
  .calc-field input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0}
  .calc-field input[type=number]{-moz-appearance:textfield; appearance:textfield}
  .calc-field em{
    position:absolute; right:13px; top:50%; transform:translateY(-50%);
    font-style:normal; font-size:.72rem; color:var(--dim); letter-spacing:1px;
  }
  .calc-out{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  .calc-out div{background:#050b08; border-radius:9px; padding:9px 11px}
  .calc-out small{display:block; font-size:.6rem; letter-spacing:1.5px; color:var(--dim); text-transform:uppercase}
  .calc-out strong{display:block; margin-top:2px; font-size:1.02rem; color:var(--teal); font-variant-numeric:tabular-nums}
  .calc-out div:last-child strong{color:var(--mint)}
  .calc-note{font-size:.66rem; color:var(--dim); min-height:14px}

  @keyframes iconPop{
    0%{transform:scale(1) rotate(0)}
    35%{transform:scale(1.35) rotate(-10deg)}
    65%{transform:scale(.92) rotate(6deg)}
    100%{transform:scale(1.12) rotate(0)}
  }
  @keyframes ringPulse{
    0%{transform:scale(.95); opacity:.9}
    100%{transform:scale(1.55); opacity:0}
  }
  @keyframes spinRing{to{transform:rotate(360deg)}}

  .btn .ico.coin{background:transparent}
  .btn:hover .ico.coin{background:transparent}
  .btn .ico.coin svg{width:40px; height:40px; filter:drop-shadow(0 0 7px rgba(22,242,155,.4)); transition:filter .25s}
  .btn:hover .ico.coin svg{filter:drop-shadow(0 0 13px rgba(22,242,155,.8))}
  .glint{animation:glint 3.6s ease-in-out infinite}
  .btn:hover .glint{animation-duration:1.4s}
  @keyframes glint{
    0%, 55%{transform:translateX(-150px)}
    80%, 100%{transform:translateX(170px)}
  }

  /* ---------- LAYAR HARGA ---------- */
  #harga{align-items:stretch}
  .head{display:flex; align-items:center; gap:14px; margin-bottom:14px; width:100%}
  .back{
    background:none; border:1px solid rgba(255,255,255,.16); color:#fff;
    width:34px; height:34px; border-radius:8px; cursor:pointer;
    font-size:1rem; transition:border-color .2s; flex-shrink:0;
    -webkit-tap-highlight-color:transparent;
  }
  .back:hover, .back:active{border-color:var(--mint)}
  .head h2{font-size:1rem; letter-spacing:2px; font-weight:700; text-transform:uppercase}
  .head .cur{
    margin-left:auto; font-size:.68rem; letter-spacing:1px; color:var(--dim);
    border:1px solid rgba(255,255,255,.14); border-radius:6px; padding:3px 8px;
  }

  .rate-status{
    font-size:.72rem; color:var(--dim); margin-bottom:12px;
    display:flex; align-items:center; gap:7px; width:100%;
  }
  .rate-status .dot{width:6px; height:6px; border-radius:50%; background:var(--dim); flex-shrink:0}
  .rate-status .dot.ok{background:var(--mint)}
  .rate-status .dot.load{background:var(--yellow); animation:blink .8s infinite}
  .rate-status .dot.err{background:#e05555}
  .rate-status button{background:none;border:none;color:var(--mint);cursor:pointer;text-decoration:underline;font-size:.72rem;padding:0}
  @keyframes blink{50%{opacity:.25}}

  .sec{
    width:100%; font-size:.66rem; letter-spacing:2px; color:var(--dim);
    text-transform:uppercase; margin:12px 0 6px;
  }
  .sec:first-child{margin-top:0}
  .sec b{color:var(--teal); font-weight:600}

  .rows{display:flex; flex-direction:column; gap:1px; background:rgba(255,255,255,.07); border-radius:10px; overflow:hidden; width:100%}
  .row{
    display:flex; justify-content:space-between; align-items:center;
    background:#050b08; padding:12px 16px; font-size:.95rem;
  }
  .row .rbx{font-weight:700}
  .row .rbx small{display:block; color:var(--dim); font-size:.68rem; font-weight:400; margin-top:1px}
  .row .rp{font-weight:800; color:var(--teal); font-variant-numeric:tabular-nums}
  .row.hot .rp{color:var(--yellow)}

  .foot{margin-top:auto; padding-top:18px; text-align:center; font-size:.68rem; color:var(--dim); letter-spacing:1px}
  .foot a{color:var(--green); text-decoration:none}
  .foot a:hover{text-decoration:underline}
</style>
</head>

const RATE_BAWAH = 170, RATE_ATAS = 165, MIN_ORDER = 10;
const DEFAULT_RATE = 0.000226;
const IG = "https://www.instagram.com/kavzaa_s?mdxt=MWlxYmlyMGcxZ2s5cA==";

let cur = "idr";
let rate = DEFAULT_RATE;
let rateLoaded = false;

/* ================= NAVIGASI ================= */
function ke(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}
function bukaHarga(mataUang){
  cur = mataUang;
  ke("harga");
  document.getElementById("hargaTitle").textContent =
    cur === "idr" ? "Harga Rupiah" : "Harga Ringgit";
  document.getElementById("hargaCur").textContent = cur === "idr" ? "IDR" : "MYR";
  document.getElementById("rateStatus").style.display = cur === "myr" ? "flex" : "none";
  render();
  if(cur === "myr" && !rateLoaded) loadRate();
}

/* ================= FORMAT ================= */
const fmtRp = v => "Rp" + Math.round(v).toLocaleString("id-ID");
const fmtRm = v => "RM" + v.toLocaleString("en-MY",{minimumFractionDigits:2, maximumFractionDigits:2});

/* ================= RENDER ================= */
function rowHTML(p, i){
  const hot = p.rbx >= 100 ? " hot" : "";
  const val = cur === "idr" ? fmtRp(p.rp) : fmtRm(p.rp * rate);
  const per = cur === "idr"
    ? fmtRp(p.rp / p.rbx) + " / R"
    : fmtRm(p.rp * rate / p.rbx) + " / R";
  return `<div class="row tap${hot}" style="animation-delay:${i*35}ms" onclick="salin(this, '${val}')">
      <span class="rbx">${p.rbx.toLocaleString("id-ID")} Robux<small>${per} · tap buat salin</small></span>
      <span class="rp">${val}</span>
    </div>`;
}
function render(){
  document.getElementById("rowsHemat").innerHTML =
    PAKET.filter(p=>p.rbx < 100).map(rowHTML).join("");
  document.getElementById("rowsGrosir").innerHTML =
    PAKET.filter(p=>p.rbx >= 100).map(rowHTML).join("");
}

/* ================= TOAST + COPY ================= */
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(()=>t.classList.remove("show"), 1800);
}
function salin(el, teks){
  navigator.clipboard?.writeText(teks).then(
    ()=>toast(teks + " tersalin"),
    ()=>toast(teks)
  );
}
function pesan(){
  window.open(IG, "_blank");
}

/* ================= KURS (cuma dipakai mode RM) ================= */
const ENDPOINTS = [
  {url:"https://open.er-api.com/v6/latest/IDR", pick:d=>d?.rates?.MYR},
  {url:"https://api.frankfurter.app/latest?from=IDR&to=MYR", pick:d=>d?.rates?.MYR},
  {url:"https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/idr.json", pick:d=>d?.idr?.myr}
];
function setRate(state, text){
  document.getElementById("rateDot").className = "dot " + state;
  document.getElementById("rateText").innerHTML = text;
}
let rateLoading = false;
async function loadRate(){
  if(rateLoading) return;
  rateLoading = true;
  setRate("load", "Ambil kurs…");
  for(const ep of ENDPOINTS){
    try{
      const ctrl = new AbortController();
      const t = setTimeout(()=>ctrl.abort(), 8000);
      const res = await fetch(ep.url + (ep.url.includes("?")?"&":"?") + "_t=" + Date.now(), {cache:"no-store", signal:ctrl.signal});
      clearTimeout(t);
      const r = ep.pick(await res.json());
      if(!(r > 0)) throw new Error("kurs nggak ada");
      rate = r; rateLoaded = true; rateLoading = false;
      setRate("ok", `RM1 = ${Math.round(1/rate).toLocaleString("id-ID")} Rp · <button onclick="loadRate()">refresh</button>`);
      render(); hitungCepat();
      return;
    }catch(e){ /* coba endpoint berikutnya */ }
  }
  rateLoading = false;
  setRate("err", `Kurs gagal diambil (offline?) — pakai kurs default · <button onclick="loadRate()">coba lagi</button>`);
  render(); hitungCepat();
}

/* ================= HITUNG ROBUX (menu) ================= */
function hitungCepat(){
  const v = document.getElementById("rbxCalc").value;
  const n = parseInt(v, 10);
  const rpEl  = document.getElementById("calcRp");
  const rmEl  = document.getElementById("calcRm");
  const note  = document.getElementById("calcNote");
  const label = document.getElementById("calcRate");

  if(v === "" || isNaN(n)){
    rpEl.textContent = "—"; rmEl.textContent = "—";
    label.textContent = "rate Rp170 / R";
    note.textContent = "Bebas nominal · minimum 10 Robux";
    return;
  }
  if(n < MIN_ORDER){
    rpEl.textContent = "—"; rmEl.textContent = "—";
    note.textContent = "Minimum order 10 Robux";
    return;
  }
  const per = n >= 100 ? RATE_ATAS : RATE_BAWAH;
  const rp  = n * per;
  rpEl.textContent = fmtRp(rp);
  label.textContent = `rate Rp${per} / R`;
  rmEl.textContent = rateLoaded ? fmtRm(rp * rate) : "…";

  if(!rateLoaded){
    note.textContent = "Ambil kurs live buat Ringgit…";
    loadRate();
  }else{
    note.textContent = `Ringgit pakai kurs live · ${fmtRm(rp * rate)}`;
  }
}
document.getElementById("rbxCalc").addEventListener("input", hitungCepat);

/* ================= INTRO → MENU ================= */
const introTimer = setTimeout(()=>ke("menu"), 2400);
document.getElementById("intro").addEventListener("click", ()=>{
  clearTimeout(introTimer); ke("menu");   // tap buat skip intro
});

/* auto-refresh kurs selama layar RM aktif + pas tab dibuka lagi */
setInterval(()=>{ if(cur === "myr" && rateLoaded) loadRate(); }, 60_000);
document.addEventListener("visibilitychange", ()=>{
  if(!document.hidden && cur === "myr" && rateLoaded) loadRate();
});
